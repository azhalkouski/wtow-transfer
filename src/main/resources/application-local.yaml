spring:
  config:
    import: file:.env.local[.properties]
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed # keep both migration and seed; it's replace, not append
    user: ${POSTGRES_ADMIN_USER}
    password: ${POSTGRES_ADMIN_PASSWORD}
    default-schema: core # this controls where the flyway_schema_history lands
  jpa:
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        highlight_sql: true
logging:
  level:
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
